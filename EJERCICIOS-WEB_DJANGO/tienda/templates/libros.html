<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Libros</title>
</head>
<body>
    <h1>Lista de libros</h1>
    {% for libro in libros %}
        <p>{{ libro.titulo }} - {{ libro.autor }} - {{ libro.precio }}€</p>
    {% empty %}
        <p>No hay libros registrados.</p>
    {% endfor %}
</body>
</html>
